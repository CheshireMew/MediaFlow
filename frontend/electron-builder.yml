appId: com.mediaflow.ui
productName: MediaFlow
directories:
  output: release
files:
  - from: .
    filter:
      - package.json
      - dist-electron/**/*
      - dist/index.html
      - dist/assets/**/*
      - dist/grid.svg
      - dist/vite.svg
      - "!dist/**/*.map"
      - "!dist-electron/**/*.map"

extraResources:
  - from: src/assets/fonts
    to: fonts
    filter:
      - "LXGWWenKai-Regular.ttf"

  - from: src/shared/fontCatalog.json
    to: fontCatalog.json

  # ── bin/ ──────────────────────────────────────────────────
  # Runtime feature availability is defined by contracts/runtime-contract.json.
  # Bundled tools are read-only fallbacks; updates and downloads go under runtime/tools.
  - from: ../bin
    to: bin
    filter:
      - "ffmpeg.exe"
      - "ffprobe.exe"

  - from: ../THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md

  - from: ../LICENSE
    to: legal/LICENSE

  - from: ../LICENSE-NOTICE.md
    to: legal/LICENSE-NOTICE.md

  - from: ../LICENSING.md
    to: legal/LICENSING.md

  - from: ../third_party_licenses
    to: legal/third_party_licenses
    filter:
      - "**/*"

  # ── dist-desktop-backend/ ─────────────────────────────────
  # PyInstaller-compiled Python backend runtime
  - from: ../dist-desktop-backend/mediaflow-backend
    to: backend
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/coverage/**"
      - "!**/pytest/**"
      - "!**/tests/**"
      - "!**/test/**"
      - "!**/testing/**"
      - "!**/Pythonwin/**"
      - "!**/pythonwin/**"
      - "!**/torch/**"
      - "!**/torchaudio/**"
      - "!**/torchvision/**"
      - "!**/_test*.pyd"
      - "!**/torch/bin/protoc.exe"
      - "!**/pytest-*.dist-info/**"
      - "!**/pytest_asyncio-*.dist-info/**"

win:
  target:
    - portable
  icon: resources/icon.ico
  signAndEditExecutable: false
  signExts:
    - "!.exe"
  artifactName: ${productName}-Portable-${version}.${ext}
